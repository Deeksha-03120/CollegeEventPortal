
apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-events
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: college-events
  template:
    metadata:
      labels:
        app: college-events
    spec:
      containers:
        - name: college-events
          image: 24mis0129/college-events:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
